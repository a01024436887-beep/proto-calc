name: 회차 자동 갱신

on:
  schedule:
    # UTC 기준. KST 07:00 / 19:00 하루 2회.
    - cron: "0 22 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      seed_latest:
        description: "판매중인 회차가 없으면 최근 마감 회차로 채우기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-games
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 회차 수집
        run: python scripts/fetch_games.py ${{ inputs.seed_latest && '--seed-latest' || '' }}

      - name: 변경 시에만 커밋 & 푸시
        run: |
          if git diff --quiet -- data/games.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          ROUND=$(python -c "import json;print(json.load(open('data/games.json',encoding='utf-8'))['round'])")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json
          git commit -m "data: 제${ROUND}회차 갱신"
          git push
