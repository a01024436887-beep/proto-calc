<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>승무패 14경기 조합 계산기</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --pitch:#0d2a1c;
  --chalk:rgba(247,244,236,.88);
  --chalk-dim:rgba(247,244,236,.55);
  --line:rgba(247,244,236,.16);
  --paper:#f7f3e8;
  --paper-edge:#ddd4bd;
  --cell:#fffdf6;
  --ink:#26251f;
  --ink-dim:#8a8471;
  --win:#c22f27;
  --draw:#3a3d45;
  --lose:#1d4fd7;
  --gold:#f2c76c;
  --warn:#f0a94e;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
body{
  font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  background:repeating-linear-gradient(0deg, transparent 0 92px, rgba(255,255,255,.03) 92px 184px), var(--pitch);
  color:var(--chalk);
  min-height:100vh;
  padding:22px 14px 128px;
}
.wrap{max-width:560px;margin:0 auto}

/* ── header ── */
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:var(--chalk-dim);margin-bottom:6px}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.hint{font-size:13px;line-height:1.65;color:var(--chalk-dim);margin-top:8px}
.tools{display:flex;justify-content:space-between;align-items:center;margin:16px 0 12px;gap:10px}
.unit-ctl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--chalk-dim)}
.unit-ctl input{
  width:84px;padding:7px 9px;border-radius:9px;border:1px solid var(--line);
  background:rgba(255,255,255,.06);color:var(--chalk);
  font-family:'IBM Plex Mono',monospace;font-size:14px;text-align:right;
}
.unit-ctl input:focus-visible{outline:2px solid var(--chalk);outline-offset:1px}
.ghost{
  padding:8px 12px;border-radius:9px;border:1px solid var(--line);
  background:transparent;color:var(--chalk-dim);font-size:12.5px;
}
.ghost:active{background:rgba(255,255,255,.08)}

/* ── marking slip ── */
.slip{
  background:var(--paper);border-radius:var(--radius);
  padding:12px 12px 14px;box-shadow:0 10px 28px rgba(0,0,0,.4);
}
.slip-label{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;
  color:var(--ink-dim);padding:2px 2px 9px;margin-bottom:10px;
  border-bottom:2px dashed var(--paper-edge);
  display:flex;justify-content:space-between;
}
.game{padding:7px 0}
.game + .game{border-top:1px solid #eee7d3}
.minfo{font-size:12.5px;color:#5f5a4b;line-height:1.45;padding:1px 2px 7px}
.row{display:grid;grid-template-columns:40px 1fr 1fr 1fr 38px;gap:8px;align-items:center}
.no{
  height:34px;display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:var(--ink);
  background:#efe9d8;border-radius:8px;
}
.mark{
  height:46px;border-radius:10px;border:1.5px solid #cfc7ae;background:var(--cell);
  color:var(--ink-dim);font-size:16px;font-weight:700;
  transition:background .12s,color .12s,border-color .12s;
}
.mark:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.mark.on{color:#fff}
.mark.w.on{background:var(--win);border-color:var(--win)}
.mark.d.on{background:var(--draw);border-color:var(--draw)}
.mark.l.on{background:var(--lose);border-color:var(--lose)}
.cols{display:grid;grid-template-columns:40px 1fr 1fr 1fr 38px;gap:8px;padding-bottom:4px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);text-align:center}
.chk{
  width:30px;height:30px;margin:0 auto;display:flex;align-items:center;justify-content:center;
  border-radius:8px;border:1.5px solid #cfc7ae;background:var(--cell);
  color:var(--ink-dim);font-size:15px;font-weight:700;
  transition:background .12s,color .12s,border-color .12s;
}
.chk::before{content:'?'}
.chk.on{background:#b9861f;border-color:#b9861f;color:#fff}
.chk.on::before{content:'\2713'}
.chk:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.hint b{color:var(--gold);font-weight:700}

/* ── combinations ── */
.sec-title{font-size:15px;font-weight:700;margin:26px 2px 10px}
.combo-card{
  background:var(--paper);border-radius:var(--radius);
  padding:14px 12px;box-shadow:0 10px 28px rgba(0,0,0,.4);color:var(--ink);
}
.csum{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px}
.csum b{font-family:'IBM Plex Mono',monospace}
.csec-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--ink-dim);margin:16px 0 9px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:baseline;gap:4px;padding:8px 11px;border-radius:10px;background:#eee8d5}
.chip .gn{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim)}
.chip .go{font-size:17px;font-weight:700;line-height:1}
.chip.var{background:#f8ecc9;border:1px solid #e9d7a4}
.crow{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid #eee7d3}
.cri{flex:0 0 28px;padding-top:9px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim);text-align:right}
.crow .chips{flex:1}
.missing-line{font-size:13px;color:#a8843c;margin-top:12px}
.buy-note{font-size:13.5px;color:var(--ink-dim);line-height:1.75;margin-top:16px}
.w-ink{color:var(--win)}
.d-ink{color:var(--draw)}
.l-ink{color:var(--lose)}
.empty,.cap{font-size:13.5px;color:var(--ink-dim);line-height:1.7}
.cap{margin-top:12px}

/* ── scoreboard ── */
.board{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  background:rgba(8,20,13,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
  padding:10px 16px calc(12px + env(safe-area-inset-bottom));
}
.board-in{max-width:560px;margin:0 auto}
.board-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.cell{display:flex;align-items:baseline;gap:6px}
.lbl{font-size:12px;color:var(--chalk-dim)}
.num{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:var(--chalk)}
.num.money{color:var(--gold)}
.suffix{font-size:12px;color:var(--chalk-dim)}
.note{font-size:11.5px;color:var(--warn);margin-top:6px}
.note:empty{display:none}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow" id="roundLabel">축구토토 승무패 · 14경기</p>
    <h1>조합 계산기</h1>
    <p class="hint">아는 경기는 승·무·패 중 하나를 골라 거세요. 모르는 경기는 오른쪽 <b>모름</b>을 한 번 체크하면 그 경기의 승·무·패 세 가지가 전부 조합에 들어갑니다. 두 가지로만 좁히고 싶으면 버튼을 직접 2개 누르면 돼요.</p>
  </header>

  <div class="tools">
    <label class="unit-ctl">단가
      <input id="unit" type="number" inputmode="numeric" value="1000" min="0" step="100"> 원
    </label>
    <button id="reset" class="ghost">전체 지우기</button>
  </div>

  <section class="slip" aria-label="경기별 승·무·패 선택">
    <div class="slip-label"><span>MARK CARD</span><span>모름 = 승·무·패 전부</span></div>
    <div class="cols" aria-hidden="true"><span>경기</span><span></span><span></span><span></span><span>모름</span></div>
    <div id="rows"></div>
  </section>

  <h2 class="sec-title">경우의 수</h2>
  <section class="combo-card">
    <div id="comboWrap"></div>
  </section>

</div>

<footer class="board">
  <div class="board-in">
    <div class="board-row">
      <div class="cell"><span class="lbl">조합</span><b id="combos" class="num">1</b><span class="suffix">가지</span></div>
      <div class="cell"><span class="lbl">총액</span><b id="amount" class="num money">1,000</b><span class="suffix">원</span></div>
    </div>
    <p id="note" class="note"></p>
  </div>
</footer>

<script>
(function(){
  var N = 14, CAP = 500, LIMIT = 100000;
  var OUT = ['승','무','패'];
  var CLS = {'승':'w','무':'d','패':'l'};
  var INK = {'승':'w-ink','무':'d-ink','패':'l-ink'};

  var picks = [];
  for (var i = 0; i < N; i++) picks.push({});

  var rowsEl   = document.getElementById('rows');
  var combosEl = document.getElementById('combos');
  var amountEl = document.getElementById('amount');
  var noteEl   = document.getElementById('note');
  var unitEl   = document.getElementById('unit');
  var wrapEl   = document.getElementById('comboWrap');

  /* build 14 rows */
  var html = '';
  for (var g = 0; g < N; g++) {
    html += '<div class="game"><div class="minfo" id="m' + g + '" hidden></div><div class="row">'
          + '<span class="no">' + (g + 1) + '</span>';
    for (var k = 0; k < 3; k++) {
      var o = OUT[k];
      html += '<button type="button" class="mark ' + CLS[o] + '" data-i="' + g + '" data-o="' + o
            + '" aria-pressed="false" aria-label="' + (g + 1) + '경기 ' + o + '">' + o + '</button>';
    }
    html += '<button type="button" class="chk" data-i="' + g + '" aria-pressed="false" aria-label="' + (g + 1) + '\uacbd\uae30 \ubaa8\ub984, \uc2b9\ubb34\ud328 \uc804\ubd80 \uc120\ud0dd"></button></div></div>';
  }
  rowsEl.innerHTML = html;

  rowsEl.addEventListener('click', function(e){
    var chk = e.target.closest('.chk');
    if (chk) {
      var ci = +chk.dataset.i;
      setGame(ci, count(ci) === 3 ? [] : OUT);
      update();
      return;
    }
    var b = e.target.closest('.mark');
    if (!b) return;
    var i = +b.dataset.i, o = b.dataset.o;
    if (picks[i][o]) { delete picks[i][o]; b.classList.remove('on'); b.setAttribute('aria-pressed','false'); }
    else             { picks[i][o] = true;  b.classList.add('on');    b.setAttribute('aria-pressed','true');  }
    update();
  });

  function setGame(i, outs){
    picks[i] = {};
    for (var k = 0; k < outs.length; k++) picks[i][outs[k]] = true;
    var btns = rowsEl.querySelectorAll('.mark[data-i="' + i + '"]');
    for (var j = 0; j < btns.length; j++) {
      var on = !!picks[i][btns[j].dataset.o];
      btns[j].classList.toggle('on', on);
      btns[j].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }

  unitEl.addEventListener('input', update);

  document.getElementById('reset').addEventListener('click', function(){
    for (var i = 0; i < N; i++) picks[i] = {};
    var marks = rowsEl.querySelectorAll('.mark.on');
    for (var j = 0; j < marks.length; j++) { marks[j].classList.remove('on'); marks[j].setAttribute('aria-pressed','false'); }
    update();
  });

  function count(i){ var c = 0; for (var o in picks[i]) c++; return c; }
  function list(i){ var a = []; for (var k = 0; k < 3; k++) if (picks[i][OUT[k]]) a.push(OUT[k]); return a; }
  function fmt(n){ return n.toLocaleString('ko-KR'); }

  function update(){
    var unit = parseInt(unitEl.value, 10); if (isNaN(unit) || unit < 0) unit = 0;
    var total = 1, missing = [], multi = [], fixed = [];
    for (var i = 0; i < N; i++) {
      var c = count(i);
      total *= (c || 1);
      if (c === 0) missing.push(i + 1);
      else if (c === 1) fixed.push(i);
      else multi.push(i);
      var chkBtn = rowsEl.querySelector('.chk[data-i="' + i + '"]');
      if (chkBtn) { chkBtn.classList.toggle('on', c === 3); chkBtn.setAttribute('aria-pressed', c === 3 ? 'true' : 'false'); }
    }
    var amount = total * unit;
    combosEl.textContent = fmt(total);
    amountEl.textContent = fmt(amount);

    var msgs = [];
    if (missing.length === N) msgs.push('경기를 선택해 주세요');
    else if (missing.length > 6) msgs.push('미선택 ' + missing.length + '경기');
    else if (missing.length) msgs.push('미선택 ' + missing.join(', ') + '경기');
    if (amount > LIMIT) msgs.push('1회 구매한도 10만원 초과');
    noteEl.textContent = msgs.join(' \u00b7 ');

    renderCombos(multi, unit);
  }

  function chip(g, o, isVar){
    return '<span class="chip' + (isVar ? ' var' : '') + '"><span class="gn">' + (g + 1) + '</span><span class="go ' + INK[o] + '">' + o + '</span></span>';
  }

  function renderCombos(multi, unit){
    var anyPicked = false;
    for (var i = 0; i < N; i++) if (count(i) > 0) { anyPicked = true; break; }
    if (!anyPicked) {
      wrapEl.innerHTML = '<p class="empty">경기를 선택하면 여기에 고정픽과 조합별로 어떻게 걸면 되는지가 큼직하게 나옵니다.</p>';
      return;
    }

    var lists = [], varTotal = 1, missing = [];
    for (var j = 0; j < multi.length; j++) { lists.push(list(multi[j])); varTotal *= lists[j].length; }

    var fixedHtml = '';
    for (var g = 0; g < N; g++) {
      var c = count(g);
      if (c === 1) fixedHtml += chip(g, list(g)[0], false);
      else if (c === 0) missing.push(g + 1);
    }

    var h = '<p class="csum">조합 <b>' + fmt(varTotal) + '</b>가지 × ' + fmt(unit) + '원 = <b>' + fmt(varTotal * unit) + '</b>원</p>';

    if (fixedHtml) h += '<p class="csec-label">고정픽 &mdash; 모든 조합에 공통</p><div class="chips">' + fixedHtml + '</div>';
    if (missing.length) h += '<p class="missing-line">아직 미선택: ' + missing.join(', ') + '경기</p>';

    if (multi.length) {
      h += '<p class="csec-label">모름 ' + multi.length + '경기 &mdash; 조합마다 이렇게 바꿔 겁니다</p>';
      var idx = [], r = 0, shown = Math.min(varTotal, CAP);
      for (j = 0; j < multi.length; j++) idx.push(0);
      while (true) {
        r++;
        var row = '';
        for (j = 0; j < multi.length; j++) row += chip(multi[j], lists[j][idx[j]], true);
        h += '<div class="crow"><span class="cri">' + r + '</span><div class="chips">' + row + '</div></div>';
        if (r >= shown) break;
        var p = multi.length - 1;
        while (p >= 0) { idx[p]++; if (idx[p] < lists[p].length) break; idx[p] = 0; p--; }
      }
      if (varTotal > CAP) h += '<p class="cap">조합이 많아 전체 ' + fmt(varTotal) + '가지 중 앞 ' + fmt(CAP) + '가지만 표시했어요. 조합 수와 총액은 전체 기준입니다.</p>';
      h += '<p class="buy-note">읽는 법: 고정픽 그대로 + 조합 줄 하나 = 베팅 한 장입니다. 실제 구매는 마킹지나 베트맨에서 위 마킹카드처럼 복수 체크해 한 장으로 사면 전체 조합이 같이 걸립니다.</p>';
    } else {
      h += '<p class="buy-note">모름 체크한 경기가 없어서 위 고정픽 한 장이 전부입니다.</p>';
    }
    wrapEl.innerHTML = h;
  }

  function loadGames(){
    fetch('data/games.json', {cache:'no-store'}).then(function(res){
      if (!res.ok) throw new Error('no data');
      return res.json();
    }).then(function(d){
      var label = '\ucd95\uad6c\ud1a0\ud1a0 \uc2b9\ubb34\ud328';
      if (d.round) label += ' \u00b7 \uc81c' + d.round + '\ud68c';
      if (d.deadline) label += ' \u00b7 \ub9c8\uac10 ' + d.deadline;
      document.getElementById('roundLabel').textContent = label;
      var gs = d.games || [];
      for (var k = 0; k < gs.length; k++) {
        var g = gs[k];
        var i = (g.no ? g.no : k + 1) - 1;
        if (i < 0 || i >= N) continue;
        var el = document.getElementById('m' + i);
        if (!el) continue;
        var parts = [];
        if (g.league) parts.push(g.league);
        if (g.home || g.away) parts.push((g.home || '?') + ' vs ' + (g.away || '?'));
        if (g.kickoff) parts.push(g.kickoff);
        if (!parts.length) continue;
        el.textContent = parts.join('  \u00b7  ');
        el.hidden = false;
      }
    }).catch(function(){ /* games.json이 없으면 번호만 표시 */ });
  }

  loadGames();
  update();
})();
</script>
</body>
</html>
